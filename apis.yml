aid: vulcan-technologies
name: Vulcan Technologies
description: >-
  Vulcan Technologies builds frontier AI for law and government, headquartered in
  Austin, Texas and founded in 2025. Its flagship product, Justinian, is a legal AI
  agent that runs on roughly 157 billion records of American law and policy —
  including 13+ billion court records, every municipal code, and federal and state
  statutes, regulations, and active legislative sessions — planning research,
  drafting work product, and verifying and citing every claim against source. A
  second product, Trajan, is a government AI concierge for citizen services such as
  permits, registrations, and license renewals. Vulcan is FedRAMP Ready, runs in AWS
  GovCloud (US), and serves customers including the Virginia Office of Regulatory
  Management, the U.S. Department of Education, and South Carolina agencies. The
  company raised a $10.9M seed round (October 2025) co-led by General Catalyst and
  Cubit Capital, with participation from Y Combinator, SV Angel, and others. Vulcan
  is a product/agent company and does not currently publish a public developer API.
